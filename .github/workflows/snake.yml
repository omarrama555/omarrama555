name: Generate Snake

on:
  # بيشتغل تلقائي كل 24 ساعة (الساعة 12 بالليل)
  schedule:
    - cron: "0 0 * * *" 
  
  # بيسمح لك تشغل الأنميشن يدوي في أي وقت للتجربة
  workflow_dispatch:
  
  # بيشتغل أول ما تعمل أي تعديل (Push) على فرع main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # توليد ثعبان المساهمات (نسخة الألوان الداكنة والفاتحة)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: omarrama555
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # رفع الملف الناتج لفرع مستقل اسمه output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
